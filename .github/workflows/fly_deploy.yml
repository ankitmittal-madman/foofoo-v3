name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths: ["ghar_re_core/**", "ghar_re_service/**", "contracts/**", ".github/workflows/fly_deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: Generic deployment target; production uses the governed catalogue workflow
        required: true
        type: choice
        options: [staging]
        default: staging

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
      FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
    steps:
      - name: Report unconfigured staging deployment
        if: env.FLY_API_TOKEN == '' || env.FLY_STAGING_APP == ''
        run: |
          echo "::warning title=Staging deployment skipped::Configure the FLY_STAGING_APP variable and FLY_STAGING_API_TOKEN secret in the GitHub staging environment to enable automatic deployment."
      - if: env.FLY_API_TOKEN != '' && env.FLY_STAGING_APP != ''
        uses: actions/checkout@v4
      - if: env.FLY_API_TOKEN != '' && env.FLY_STAGING_APP != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy and smoke-test staging
        if: env.FLY_API_TOKEN != '' && env.FLY_STAGING_APP != ''
        run: |
          flyctl deploy --config ghar_re_service/fly.toml --app "$FLY_STAGING_APP"
          curl --fail --retry 10 --retry-delay 3 "https://${FLY_STAGING_APP}.fly.dev/readyz"
