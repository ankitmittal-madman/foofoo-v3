[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foofoo-aux-re-service"
version = "0.1.0"
description = "Fully local, policy-gated auxiliary recommender for FooFoo."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1", "numpy>=2", "scipy>=1.14"]
models = [
  "joblib>=1.4",
  "lightfm==1.17; python_version < '3.12'",
  "numpy>=2",
  "openpyxl>=3.1",
  "scipy>=1.14",
]
graph-models = ["recbole>=1.2"]

[tool.setuptools]
packages = ["aux_re_service", "aux_re_service.training"]
