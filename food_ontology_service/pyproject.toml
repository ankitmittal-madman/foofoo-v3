[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foofoo-food-ontology-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.7", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
foofoo-ontology-migrate = "food_ontology_service.migrate:main"
foofoo-ontology-worker = "food_ontology_service.worker_main:main"
foofoo-ontology-cutover = "food_ontology_service.cutover:main"

[tool.setuptools]
packages = ["food_ontology_service"]

[tool.setuptools.package-data]
food_ontology_service = ["migrations/*.sql"]
