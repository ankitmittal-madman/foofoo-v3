name: rotate-prospective-user-credential

on:
  workflow_dispatch:
    inputs:
      expected_profile_id:
        description: Existing production Auth/profile UUID authorized for credential rotation
        required: true
        type: string
      confirmation:
        description: Enter ROTATE_PROSPECTIVE_CREDENTIAL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rotate-prospective-user-credential
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.FOOFOO_SUPABASE_URI }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      TEST_USER_PASSWORD: ${{ secrets.GHAR_SIGNIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the production database driver
        run: pip install psycopg2-binary
      - name: Rotate and verify the existing protected credential
        env:
          EXPECTED_PROFILE_ID: ${{ inputs.expected_profile_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python -m ops.recommendation.rotate_prospective_credential \
            --expected-profile-id "$EXPECTED_PROFILE_ID" \
            --confirm "$CONFIRMATION"
