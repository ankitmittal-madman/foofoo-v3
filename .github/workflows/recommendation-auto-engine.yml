name: recommendation-auto-engine

on:
  push:
    paths:
      - "ops/recommendation/auto_engine*.py"
      - "ops/quality/suites/test_recommendation_auto_engine.py"
      - "database/migrations/087_auto_training_control_plane.sql"
      - "database/rollback/087_auto_training_control_plane_rollback.sql"
      - "database/validation/939_auto_training_control_plane_validation.sql"
      - ".github/workflows/recommendation-auto-engine.yml"
  pull_request:
    paths:
      - "ops/recommendation/auto_engine*.py"
      - "ops/quality/suites/test_recommendation_auto_engine.py"
      - "database/migrations/087_auto_training_control_plane.sql"
      - "database/rollback/087_auto_training_control_plane_rollback.sql"
      - "database/validation/939_auto_training_control_plane_validation.sql"
      - ".github/workflows/recommendation-auto-engine.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "DB run mode; execute writes governed research staging and trains eligible models"
        required: true
        default: dry_run
        type: choice
        options:
          - audit
          - dry_run
          - execute

permissions:
  contents: read

concurrency:
  group: recommendation-auto-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local training and validation dependencies
        run: |
          python -m pip install "setuptools==79.0.1" "wheel==0.45.1"
          python -m pip install -e ".[test,training]"
          python -m pip install -e "./aux_re_service[test,models]"
          python -m pip install "psycopg2-binary>=2.9,<3"
      - name: Verify deterministic DB-first pipeline
        run: PYTHONPATH=.:aux_re_service python -m pytest -q ops/quality/suites/test_recommendation_auto_engine.py

  database-run:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOOFOO_SUPABASE_URI: ${{ secrets.FOOFOO_SUPABASE_URI }}
      REQUESTED_MODE: ${{ github.event.inputs.mode || 'dry_run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install operational runtime
        run: |
          python -m pip install "setuptools==79.0.1" "wheel==0.45.1"
          python -m pip install -e ".[training]"
          python -m pip install -e "./aux_re_service[models]"
          python -m pip install "psycopg2-binary>=2.9,<3"
      - name: Run protected DB audit, dry-run, or manual execute
        run: |
          if [ -z "${FOOFOO_SUPABASE_URI}" ]; then
            echo '{"status":"skipped","reason":"FOOFOO_SUPABASE_URI secret not configured"}' \
              > "${RUNNER_TEMP}/auto-engine-report.json"
            exit 0
          fi
          PYTHONPATH=.:aux_re_service python -m ops.recommendation.auto_engine \
            --mode "${REQUESTED_MODE}" \
            --report "${RUNNER_TEMP}/auto-engine-report.json" \
            --output-dir "${RUNNER_TEMP}/auto-engine-artifacts"
      - name: Upload governed run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-auto-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auto-engine-report.json
            ${{ runner.temp }}/auto-engine-artifacts/
          if-no-files-found: warn
          retention-days: 30
