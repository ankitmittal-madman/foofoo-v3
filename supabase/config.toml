# FooFoo — Supabase local project config (WP-8B scaffold).
# Minimal config for local development (`supabase start`). Region/production are governed by
# DOC-P3-08 (locked env map: local / foofoo-staging / foofoo-mvp). This file configures the
# LOCAL stack only; remote projects are selected via `supabase link` + secrets, never here.
project_id = "foofoo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# Edge Functions verify JWT by default (the installed CLI's own implicit default for any function
# with no [functions.<name>] override below — this CLI version (confirmed via `supabase init`'s own
# generated template) only supports per-function verify_jwt tables, not a top-level [functions]
# table; a bare `[functions]\nverify_jwt = true` is invalid TOML for it and breaks every command
# that reads this config, including `functions deploy`. Fixed WP-20: removed that invalid top-level
# table since true is already the default with no override present.

# Scheduled/internal jobs (Phase F) — invoked by pg_cron via net.http_post carrying
# `Authorization: Bearer <service_role key>` (see
# ops/audits/audit-dpdp/RUNBOOK_schedule-retention-jobs-2026-07-30.md). A service_role key IS a
# validly-signed project JWT, so it passes the platform gateway's default verify_jwt=true check
# same as any other caller — no per-function override needed. A prior override here
# (`verify_jwt = false`) removed gateway-level checking entirely, which combined with the absence
# of any application-level check meant the bare URL, no token at all, could trigger a real
# deletion run. Fixed this session: gateway check restored to the default above, and
# requireServiceRole() (supabase/functions/_shared/auth/service-role.ts) now also rejects any
# caller whose bearer token isn't this project's exact service_role key — closing the separate gap
# where a regular signed-in user's own JWT would otherwise still pass gateway verification.

[auth]
enabled = true
