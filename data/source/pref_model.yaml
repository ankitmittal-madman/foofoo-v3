config_version: 1.0
generated_from: Phase 3 (Recommendation Engine build) — s_pref ScoringModule stub, unfit.
# s_pref (ghar_re_core/preference.py) is a REAL registry-wired ScoringModule (phase="pref") but
# is numerically a no-op until a real artifact, trained on real feedback_events, exists and this
# flag is deliberately flipped by a human. FD-11 (no synthetic/fabricated labels): nothing here
# is fit, nothing is shipped — the slot in the master formula (`+ w_pref·S_pref`) simply EXISTS
# in code now instead of only in the score() docstring.
#
# enabled: master switch. False = s_pref always returns value=0.0, confidence=1.0 (see
# preference.py). CODE-LEVEL SAFETY DEFAULT (config.py pref_model_enabled) is also False if this
# key or this file is ever missing — never silently guessed on.
# mode is the lifecycle control. shadow loads and evaluates a governed artifact but contributes
# exactly zero to ranking; active requires a positive w_pref. disabled loads no artifact.
mode: disabled
# Legacy compatibility for older readers. New code derives enabled from mode.
enabled: false

# model_artifact_path: relative to this config directory. When enabled, export_bundle includes the
# artifact bytes in the content hash and service startup validates and loads the model+vectorizer.
# A missing/malformed artifact or a non-positive w_pref fails startup. null while disabled selects
# NullModelArtifactProvider, so s_pref remains exactly 0.0.
model_artifact_path: null

# w_pref: the master formula's `w_pref·S_pref` weight. Belt-and-suspenders default 0.0
# regardless of `enabled` above (mirrors foreign_demote_effective's "absent block -> 0.0"
# pattern in config.py) — even if `enabled` is mistakenly flipped on without a real weight
# decision, the term still contributes exactly 0.0 to score() until a human sets this too.
w_pref: 0.0

# training_readiness: the density gate WP-14 explicitly left unset ("flagged for the Founder,
# not guessed") — ghar_re_core.training.train_pref_model refuses to fit anything below these
# counts (see ghar_re_core.training.dataset.check_training_readiness), separate from and in
# addition to guard_sufficient_data's structural checks (zero rows / single label class) just
# above it in that module. These are STARTING numbers, not a permanent law — revisit once real
# feedback_events volume exists and an actual accrual rate is observed. CODE-LEVEL SAFETY DEFAULT
# (config.py) if this block or either key is missing is a never-satisfiable sentinel, so an unset
# threshold blocks training rather than silently permitting it.
training_readiness:
  min_real_events: 10000    # fleet-wide real (accept/like/dislike) labeled rows
  min_households: 500       # distinct households contributing at least one such row

# A candidate is never activation-eligible merely because it trained. Evaluation uses a
# household-isolated holdout and must beat a prevalence-only predictor on both Brier score and
# log loss in addition to the explicit gates below. These are intentionally conservative starting
# gates; production shadow metrics should drive later revisions through reviewed config changes.
evaluation_readiness:
  min_holdout_events: 1000
  min_auc: 0.60
  min_class_recall: 0.20
