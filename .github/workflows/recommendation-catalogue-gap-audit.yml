name: Recommendation catalogue gap audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type audit-recommendation-catalogue-gaps
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-recommendation-catalogue-gap-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'audit-recommendation-catalogue-gaps'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOFOO_SUPABASE_URI: ${{ secrets.FOOFOO_SUPABASE_URI }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      PGAPPNAME: foofoo-catalogue-gap-audit-${{ github.run_id }}
      PGOPTIONS: -c statement_timeout=5min -c lock_timeout=10s
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact production project and publication prerequisite
        run: |
          python -c 'import os; from ops.recommendation.protected_identity import database_identifies_project; assert database_identifies_project(os.environ["FOOFOO_SUPABASE_URI"], os.environ["PRODUCTION_PROJECT_REF"]), "production database identity is missing or ambiguous"'
          test "$(psql "$FOOFOO_SUPABASE_URI" -At -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('re_engine.catalogue_publication_rows(uuid,integer)') IS NOT NULL")" = "t"

      - name: Classify audit boundary state
        id: state
        run: |
          read -r gap_present tranche_present quality_present <<EOF
          $(psql "$FOOFOO_SUPABASE_URI" -At -F ' ' -v ON_ERROR_STOP=1 -c "SELECT to_regprocedure('re_engine.catalogue_publication_gap_report()') IS NOT NULL, to_regprocedure('re_engine.catalogue_enrichment_tranche_report()') IS NOT NULL, to_regprocedure('re_engine.catalogue_published_quality_report()') IS NOT NULL")
          EOF
          if [ "$gap_present" = "f" ] && [ "$tranche_present" = "f" ] && [ "$quality_present" = "f" ]; then
            echo "action=apply_all" >> "$GITHUB_OUTPUT"
          elif [ "$gap_present" = "t" ] && [ "$tranche_present" = "f" ] && [ "$quality_present" = "f" ]; then
            echo "action=apply_tranche_and_quality" >> "$GITHUB_OUTPUT"
          elif [ "$gap_present" = "t" ] && [ "$tranche_present" = "t" ] && [ "$quality_present" = "f" ]; then
            echo "action=apply_quality" >> "$GITHUB_OUTPUT"
          elif [ "$gap_present" = "t" ] && [ "$tranche_present" = "t" ] && [ "$quality_present" = "t" ]; then
            echo "action=validate" >> "$GITHUB_OUTPUT"
          else
            echo "unsafe partial catalogue audit boundary" >&2
            exit 1
          fi

      - name: Atomically install both aggregate audit boundaries
        if: steps.state.outputs.action == 'apply_all'
        run: |
          psql "$FOOFOO_SUPABASE_URI" -v ON_ERROR_STOP=1 --single-transaction \
            -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-production-schema-migrations'))" \
            -f database/migrations/102_expose_recommendation_catalogue_gaps.sql \
            -f database/validation/954_expose_recommendation_catalogue_gaps_validation.sql \
            -f database/migrations/103_measure_catalogue_enrichment_tranche.sql \
            -f database/validation/955_measure_catalogue_enrichment_tranche_validation.sql \
            -f database/migrations/104_measure_published_catalogue_quality.sql \
            -f database/validation/956_measure_published_catalogue_quality_validation.sql

      - name: Atomically extend gap audit with both quality reports
        if: steps.state.outputs.action == 'apply_tranche_and_quality'
        run: |
          psql "$FOOFOO_SUPABASE_URI" -v ON_ERROR_STOP=1 --single-transaction \
            -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-production-schema-migrations'))" \
            -f database/migrations/103_measure_catalogue_enrichment_tranche.sql \
            -f database/validation/954_expose_recommendation_catalogue_gaps_validation.sql \
            -f database/validation/955_measure_catalogue_enrichment_tranche_validation.sql \
            -f database/migrations/104_measure_published_catalogue_quality.sql \
            -f database/validation/956_measure_published_catalogue_quality_validation.sql

      - name: Atomically add published catalogue quality report
        if: steps.state.outputs.action == 'apply_quality'
        run: |
          psql "$FOOFOO_SUPABASE_URI" -v ON_ERROR_STOP=1 --single-transaction \
            -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-production-schema-migrations'))" \
            -f database/migrations/104_measure_published_catalogue_quality.sql \
            -f database/validation/954_expose_recommendation_catalogue_gaps_validation.sql \
            -f database/validation/955_measure_catalogue_enrichment_tranche_validation.sql \
            -f database/validation/956_measure_published_catalogue_quality_validation.sql

      - name: Revalidate existing audit boundary read-only
        if: steps.state.outputs.action == 'validate'
        run: |
          psql "$FOOFOO_SUPABASE_URI" -v ON_ERROR_STOP=1 --single-transaction \
            -c "SET TRANSACTION READ ONLY" \
            -f database/validation/954_expose_recommendation_catalogue_gaps_validation.sql \
            -f database/validation/955_measure_catalogue_enrichment_tranche_validation.sql \
            -f database/validation/956_measure_published_catalogue_quality_validation.sql

      - name: Capture aggregate production gap report
        env:
          ACTION_TAKEN: ${{ steps.state.outputs.action }}
        run: |
          report="$RUNNER_TEMP/recommendation-catalogue-gap-report.json"
          tranche="$RUNNER_TEMP/recommendation-catalogue-enrichment-tranche-report.json"
          quality="$RUNNER_TEMP/recommendation-catalogue-published-quality-report.json"
          psql "$FOOFOO_SUPABASE_URI" -At -v ON_ERROR_STOP=1 \
            -c "SELECT re_engine.catalogue_publication_gap_report()" > "$report"
          psql "$FOOFOO_SUPABASE_URI" -At -v ON_ERROR_STOP=1 \
            -c "SELECT re_engine.catalogue_enrichment_tranche_report()" > "$tranche"
          psql "$FOOFOO_SUPABASE_URI" -At -v ON_ERROR_STOP=1 \
            -c "SELECT re_engine.catalogue_published_quality_report()" > "$quality"
          jq --arg action "$ACTION_TAKEN" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" '. + {
              audit_action: $action,
              commit_sha: $commit,
              workflow_run_id: $run_id
            }' "$report" > "$report.checked"
          mv "$report.checked" "$report"
          jq --arg action "$ACTION_TAKEN" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" '. + {
              audit_action: $action,
              commit_sha: $commit,
              workflow_run_id: $run_id
            }' "$tranche" > "$tranche.checked"
          mv "$tranche.checked" "$tranche"
          jq --arg action "$ACTION_TAKEN" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" '. + {
              audit_action: $action,
              commit_sha: $commit,
              workflow_run_id: $run_id
            }' "$quality" > "$quality.checked"
          mv "$quality.checked" "$quality"
          jq --exit-status '
            .schema_version == "recommendation-catalogue-gap-report-v1"
            and .inventory.stored_dishes == (.inventory.active_dishes + .inventory.inactive_dishes)
            and .inventory.active_dishes == (
              .serving_readiness.publishable_dishes
              + .serving_readiness.active_not_publishable
            )
            and .ordered_funnel.active == .inventory.active_dishes
            and .ordered_funnel.taxonomy_complete_publishable
              == .serving_readiness.publishable_dishes
            and .serving_readiness.requirements_per_active_dish == 15
          ' "$report" >/dev/null
          jq --exit-status '
            .schema_version == "recommendation-catalogue-enrichment-tranche-v1"
            and .candidate_count == (
              .readiness.strict_auto_reclose_ready + .readiness.requires_review
            )
            and .policy.seed_required_fields == 13
            and .policy.seed_class_confidence_minimum == 0.700
            and .policy.strict_taxonomy_confidence_minimum == 0.800
            and .policy.strict_ingredient_confidence_minimum == 0.800
          ' "$tranche" >/dev/null
          jq --exit-status --argjson eligible "$(jq '.serving_readiness.publishable_dishes' "$report")" '
            .schema_version == "recommendation-catalogue-published-quality-v1"
            and .eligible_count == $eligible
            and .eligible_count == (
              .readiness.strict_quality_ready + .readiness.quality_review_required
            )
            and .policy.seed_required_fields == 13
            and .policy.class_confidence_minimum == 0.700
          ' "$quality" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-catalogue-gap-report
          path: |
            ${{ runner.temp }}/recommendation-catalogue-gap-report.json
            ${{ runner.temp }}/recommendation-catalogue-enrichment-tranche-report.json
            ${{ runner.temp }}/recommendation-catalogue-published-quality-report.json
          retention-days: 90
          if-no-files-found: error
