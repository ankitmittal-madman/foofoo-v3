[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foofoo-aux-re-service"
version = "0.1.0"
description = "Fully local, policy-gated auxiliary recommender for FooFoo."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
models = ["lightfm>=1.17", "recbole>=1.2"]

[tool.setuptools]
packages = ["aux_re_service"]
