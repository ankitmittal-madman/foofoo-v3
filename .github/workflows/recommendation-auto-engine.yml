name: recommendation-auto-engine

on:
  push:
    paths:
      - "ops/recommendation/auto_engine*.py"
      - "ops/quality/suites/test_recommendation_auto_engine.py"
      - "database/migrations/087_auto_training_control_plane.sql"
      - "database/rollback/087_auto_training_control_plane_rollback.sql"
      - "database/validation/939_auto_training_control_plane_validation.sql"
      - ".github/workflows/recommendation-auto-engine.yml"
  pull_request:
    paths:
      - "ops/recommendation/auto_engine*.py"
      - "ops/quality/suites/test_recommendation_auto_engine.py"
      - "database/migrations/087_auto_training_control_plane.sql"
      - "database/rollback/087_auto_training_control_plane_rollback.sql"
      - "database/validation/939_auto_training_control_plane_validation.sql"
      - ".github/workflows/recommendation-auto-engine.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode; execute writes only to the dedicated training project"
        required: true
        default: dry_run
        type: choice
        options:
          - audit
          - dry_run
          - execute
      confirm:
        description: "For execute, type write-auto-engine-training-project"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: recommendation-auto-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local training and validation dependencies
        run: |
          python -m pip install "setuptools==79.0.1" "wheel==0.45.1"
          python -m pip install -e ".[test,training]"
          python -m pip install -e "./aux_re_service[test,models]"
          python -m pip install "psycopg2-binary>=2.9,<3"
      - name: Verify deterministic DB-first pipeline
        run: PYTHONPATH=.:aux_re_service python -m pytest -q ops/quality/suites/test_recommendation_auto_engine.py

  production-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOOFOO_SUPABASE_URI: ${{ secrets.FOOFOO_SUPABASE_URI }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the protected read-only production source
        run: |
          if [ -z "$FOOFOO_SUPABASE_URI" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "Configure the production connection and project reference." >&2
            exit 1
          fi
          case "$FOOFOO_SUPABASE_URI" in
            *"postgres.$PRODUCTION_PROJECT_REF"*|*"db.$PRODUCTION_PROJECT_REF.supabase.co"*) ;;
            *) echo "Production URL does not match the production project reference." >&2; exit 1 ;;
          esac
      - name: Install audit runtime
        run: |
          python -m pip install "setuptools==79.0.1" "wheel==0.45.1"
          python -m pip install -e ".[training]"
          python -m pip install "psycopg2-binary>=2.9,<3"
      - name: Export aggregate production inspection only
        run: |
          PYTHONPATH=.:aux_re_service python -m ops.recommendation.auto_engine \
            --mode audit \
            --write-production-snapshot "${RUNNER_TEMP}/production-audit.json" \
            --report "${RUNNER_TEMP}/production-audit-status.json"
      - name: Upload aggregate production inspection
        uses: actions/upload-artifact@v4
        with:
          name: auto-engine-production-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-audit.json
          if-no-files-found: error
          retention-days: 1

  training-run:
    needs: production-audit
    environment: training
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRAINING_DATABASE_URL: ${{ secrets.TRAINING_DATABASE_URL }}
      TRAINING_PROJECT_REF: ${{ secrets.TRAINING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      REQUESTED_MODE: ${{ github.event.inputs.mode || 'dry_run' }}
      EXECUTE_CONFIRM: ${{ github.event.inputs.confirm || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: auto-engine-production-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-audit
      - name: Require the isolated training write target
        run: |
          if [ -z "$TRAINING_DATABASE_URL" ] || [ -z "$TRAINING_PROJECT_REF" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "Configure training connection and both project references." >&2
            exit 1
          fi
          if [ "$TRAINING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "Training and production project references must differ." >&2
            exit 1
          fi
          case "$TRAINING_DATABASE_URL" in
            *"postgres.$TRAINING_PROJECT_REF"*|*"db.$TRAINING_PROJECT_REF.supabase.co"*) ;;
            *) echo "Training URL does not match the training project reference." >&2; exit 1 ;;
          esac
          if [ "$REQUESTED_MODE" = "execute" ] && [ "$EXECUTE_CONFIRM" != "write-auto-engine-training-project" ]; then
            echo "Execute mode requires the exact confirmation phrase." >&2
            exit 1
          fi
      - name: Install operational runtime
        run: |
          python -m pip install "setuptools==79.0.1" "wheel==0.45.1"
          python -m pip install -e ".[training]"
          python -m pip install -e "./aux_re_service[models]"
          python -m pip install "psycopg2-binary>=2.9,<3"
      - name: Run against dedicated training storage
        run: |
          PYTHONPATH=.:aux_re_service python -m ops.recommendation.auto_engine \
            --mode "${REQUESTED_MODE}" \
            --production-snapshot "${RUNNER_TEMP}/production-audit/production-audit.json" \
            --report "${RUNNER_TEMP}/auto-engine-report.json" \
            --output-dir "${RUNNER_TEMP}/auto-engine-artifacts"
      - name: Upload governed run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-auto-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auto-engine-report.json
            ${{ runner.temp }}/auto-engine-artifacts/
          if-no-files-found: warn
          retention-days: 30
