name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths: ["ghar_re_core/**", "ghar_re_service/**", "contracts/**", ".github/workflows/fly_deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy and smoke-test staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
          FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
        run: |
          test -n "$FLY_STAGING_APP"
          flyctl deploy --config ghar_re_service/fly.toml --app "$FLY_STAGING_APP"
          curl --fail --retry 10 --retry-delay 3 "https://${FLY_STAGING_APP}.fly.dev/readyz"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy and smoke-test production after environment approval
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config ghar_re_service/fly.toml
          curl --fail --retry 10 --retry-delay 3 https://ghar-re.fly.dev/readyz
