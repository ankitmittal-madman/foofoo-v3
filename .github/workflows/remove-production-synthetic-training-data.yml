name: Remove synthetic training data from production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit first; execute only after the training-project copy is verified
        required: true
        default: audit
        type: choice
        options:
          - audit
          - execute
      confirm:
        description: For execute, type remove-production-training-batch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  cleanup:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FOOFOO_SUPABASE_URI }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      CLEANUP_MODE: ${{ inputs.mode }}
      CLEANUP_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the protected production connection
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "Configure FOOFOO_SUPABASE_URI and PRODUCTION_PROJECT_REF in production." >&2
            exit 1
          fi
          case "$DATABASE_URL" in
            *"postgres.$PRODUCTION_PROJECT_REF"*|*"db.$PRODUCTION_PROJECT_REF.supabase.co"*) ;;
            *)
              echo "The database URL does not identify the configured production project." >&2
              exit 1
              ;;
          esac
          if [ "$CLEANUP_MODE" = "execute" ] && [ "$CLEANUP_CONFIRM" != "remove-production-training-batch" ]; then
            echo "Execute mode requires the exact confirmation phrase." >&2
            exit 1
          fi

      - name: Audit cleanup preconditions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, status, synthetic_only, source_row_count, accepted_source_row_count,
                 rejected_source_row_count, normalized_record_count
          FROM ml.training_import_batches
          WHERE id='06a38fd3-ec53-54ab-ab0f-ef04bdf92c44';

          SELECT 'raw_source_rows' AS record_class, count(*) AS records
          FROM research.training_source_rows
          UNION ALL
          SELECT 'normalized_records', count(*)
          FROM research.auto_training_records;

          SELECT target_table, count(*)
          FROM research.auto_training_records
          GROUP BY target_table
          ORDER BY target_table;

          SELECT
            count(*) FILTER (WHERE first_batch_id='06a38fd3-ec53-54ab-ab0f-ef04bdf92c44')
              AS records_created_by_seed,
            count(*) FILTER (
              WHERE first_batch_id='06a38fd3-ec53-54ab-ab0f-ef04bdf92c44'
                AND last_batch_id<>'06a38fd3-ec53-54ab-ab0f-ef04bdf92c44'
            ) AS seed_records_updated_later
          FROM research.auto_training_records;

          SELECT pg_database_size(current_database()) AS database_bytes_before;
          SELECT schemaname, relname,
                 pg_total_relation_size(format('%I.%I', schemaname, relname)::regclass) AS total_bytes
          FROM pg_stat_user_tables
          WHERE (schemaname, relname) IN (
            ('research', 'training_source_rows'),
            ('research', 'auto_training_records'),
            ('ml', 'training_import_batches')
          )
          ORDER BY total_bytes DESC;
          SQL

      - name: Remove the verified isolated batch
        if: inputs.mode == 'execute'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -f database/etl/synthetic_training/001_remove_production_synthetic_batch.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f database/validation/941_remove_production_synthetic_batch_validation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "VACUUM (FULL, ANALYZE) research.auto_training_records;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "ANALYZE research.training_source_rows;"

      - name: Verify reclaimed production database space
        if: inputs.mode == 'execute'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pg_database_size(current_database()) AS database_bytes_after;
          SELECT schemaname, relname,
                 pg_total_relation_size(format('%I.%I', schemaname, relname)::regclass) AS total_bytes
          FROM pg_stat_user_tables
          WHERE (schemaname, relname) IN (
            ('research', 'training_source_rows'),
            ('research', 'auto_training_records'),
            ('ml', 'training_import_batches')
          )
          ORDER BY total_bytes DESC;

          SELECT target_table, count(*) AS retained_research_records
          FROM research.auto_training_records
          GROUP BY target_table
          ORDER BY target_table;
          SQL
