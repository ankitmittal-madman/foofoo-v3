name: re-ci

# Phase E (RE-DOC-10 phase table) — CI for the Recommendation Engine's Python side (ghar_re_core +
# ghar_re_service) and the shared contract it's built against. Mirrors backend-ci.yml's structure
# (single verify job, path-scoped triggers) so both sides of the RE follow one convention.
on:
  push:
    paths: ["ghar_re_core/**", "ghar_re_service/**", "contracts/**", ".github/workflows/re-ci.yml"]
  pull_request:
    paths: ["ghar_re_core/**", "ghar_re_service/**", "contracts/**", ".github/workflows/re-ci.yml"]

jobs:
  # RE-DOC-10 §14: neither side's suite is allowed to merge unless the contract itself is sound —
  # well-formed, and still the SINGLE file both sides read (no silently-forked local copy). Kept
  # dependency-free (stdlib only) so it runs in seconds ahead of the real suite.
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema is well-formed JSON
        run: python3 -c "import json; json.load(open('contracts/ghar-re-v1.schema.json')); print('contracts/ghar-re-v1.schema.json OK')"
      - name: Exactly one schema file in the repo (single source of truth)
        run: |
          count=$(find . -name "ghar-re-v1.schema.json" -not -path "./.git/*" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly 1 copy of ghar-re-v1.schema.json, found $count:"
            find . -name "ghar-re-v1.schema.json" -not -path "./.git/*"
            exit 1
          fi
      - name: Both sides reference the shared file, not a stale local copy
        run: |
          grep -q "contracts/ghar-re-v1.schema.json" ghar_re_service/ghar_re_service/schemas.py \
            || { echo "ghar_re_service/schemas.py no longer references the shared schema path"; exit 1; }
          grep -q "contracts/ghar-re-v1.schema.json" supabase/functions/recommendations/contract.ts \
            || { echo "supabase/functions/recommendations/contract.ts no longer references the shared schema path"; exit 1; }

  verify:
    needs: contract-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages (ghar_re_core + ghar_re_service, editable, with test + lint extras)
        run: |
          pip install -e ".[test,lint]"
          pip install -e "ghar_re_service[test]"
      # Lint + format check. ruff config lives in the root pyproject.toml and covers BOTH packages,
      # so the two halves of the RE cannot drift into different style rules (Phase C.5 Task 3,
      # replacing the Phase E placeholder that noted no tool had been chosen yet).
      - name: Lint (ruff)
        run: python3 -m ruff check ghar_re_core ghar_re_service
      # Format check covers ghar_re_service ONLY, deliberately. ghar_re_core is the frozen,
      # golden-master-locked math: running the formatter over it would rewrite ~150 places in code
      # whose output is deliberately pinned, for zero correctness gain. Lint (above) still checks
      # BOTH packages for real defects — it is only auto-formatting that stops at the service edge.
      - name: Format check (ruff, service only — see note)
        run: python3 -m ruff format --check ghar_re_service
      # Invoked as `python3 -m mypy`, NOT bare `mypy`, on purpose: the module form resolves imports
      # against the running interpreter's own site-packages, so third-party stubs (fastapi ships
      # py.typed) are found regardless of how the runner lays out its Python install.
      - name: Type check (mypy)
        run: python3 -m mypy ghar_re_core ghar_re_service/ghar_re_service
      - name: pytest — ghar_re_core (17, incl. golden-master) + ghar_re_service (32)
        run: python3 -m pytest ghar_re_core/tests/ ghar_re_service/tests/ -v
