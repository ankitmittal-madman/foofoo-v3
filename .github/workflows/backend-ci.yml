name: backend-ci

# WP-8B — backend scaffold CI. Runs formatter check, linter, type-check, and unit tests on the
# Deno Edge Function foundation. DB safety-gate checks (diet/allergen/Jain = 0 rows against
# foofoo-staging, DOC-P3-08 §CI) are added when endpoints touching those paths land (WP-8E).
#
# Also triggers on contracts/** (Phase E, RE-DOC-10 §14): recommendations/contract.ts imports
# contracts/ghar-re-v1.schema.json directly, and the type-check + unit-test steps below exercise
# that import transitively via recommendations.test.ts — a schema-only change must still run this
# gate, not just re-ci.yml's.
on:
  push:
    paths: ["supabase/**", "contracts/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["supabase/**", "contracts/**", ".github/workflows/backend-ci.yml"]

jobs:
  # RE-DOC-10 §14: neither side's suite is allowed to merge unless the contract itself is sound —
  # well-formed, with the deployable Edge mirror byte-identical to the canonical contract.
  # Duplicated from re-ci.yml (GitHub Actions has no cheap way to share a job across separate
  # workflow files without a reusable-workflow indirection Phase E doesn't need yet) — keep the two
  # copies in sync if the check itself changes.
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema is well-formed JSON
        run: python3 -c "import json; json.load(open('contracts/ghar-re-v1.schema.json')); print('contracts/ghar-re-v1.schema.json OK')"
      - name: Edge runtime contract mirror matches the canonical source
        run: |
          cmp contracts/ghar-re-v1.schema.json \
            supabase/functions/_shared/contracts/ghar-re-v1.schema.json
      - name: Both runtimes reference their governed contract path
        run: |
          grep -q "contracts/ghar-re-v1.schema.json" ghar_re_service/ghar_re_service/schemas.py \
            || { echo "ghar_re_service/schemas.py no longer references the shared schema path"; exit 1; }
          grep -q "_shared/contracts/ghar-re-v1.schema.json" supabase/functions/recommendations/contract.ts \
            || { echo "recommendations/contract.ts no longer references the deployable mirror"; exit 1; }

  verify:
    needs: contract-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type check
        run: deno check functions/_shared/mod.ts
      - name: Unit tests
        run: deno test --allow-env functions/_tests/
