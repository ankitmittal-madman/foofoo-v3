name: Ingest governed synthetic training data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type load-training-project to load the isolated training database
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: training-database-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: inputs.confirm == 'load-training-project'
    environment: training
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.TRAINING_DATABASE_URL }}
      TRAINING_PROJECT_REF: ${{ secrets.TRAINING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require isolated training database connection
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$TRAINING_PROJECT_REF" ] || [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "Configure TRAINING_DATABASE_URL, TRAINING_PROJECT_REF, and PRODUCTION_PROJECT_REF in the training environment." >&2
            exit 1
          fi
          if [ "$TRAINING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "Training and production project references match; refusing database access." >&2
            exit 1
          fi
          case "$DATABASE_URL" in
            *"postgres.$TRAINING_PROJECT_REF"*|*"db.$TRAINING_PROJECT_REF.supabase.co"*) ;;
            *)
              echo "TRAINING_DATABASE_URL does not identify TRAINING_PROJECT_REF; refusing database access." >&2
              exit 1
              ;;
          esac

      - name: Install ingestion runtime
        run: |
          python -m pip install -e "./aux_re_service[test]"
          python -m pip install "psycopg2-binary>=2.9,<3"

      - name: Verify importer and policy tests
        run: PYTHONPATH=aux_re_service pytest -q aux_re_service/tests/test_db_ingestion.py

      - name: Bootstrap isolated training schemas
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-training-schema-migrations'))" \
            -f database/training/001_training_database_bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f database/training/901_training_database_bootstrap_validation.sql

      - name: Apply private training control plane when absent
        run: |
          present="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('research.auto_training_records') IS NOT NULL")"
          if [ "$present" != "t" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
              -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-training-schema-migrations'))" \
              -f database/migrations/087_auto_training_control_plane.sql
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f database/validation/939_auto_training_control_plane_validation.sql

      - name: Apply governed workbook lineage when absent
        run: |
          present="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('research.training_source_rows') IS NOT NULL")"
          if [ "$present" != "t" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
              -c "SELECT pg_advisory_xact_lock(hashtext('foofoo-training-schema-migrations'))" \
              -f database/migrations/088_govern_synthetic_training_ingestion.sql
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f database/validation/940_govern_synthetic_training_ingestion_validation.sql

      - name: Execute private synthetic load
        run: |
          PYTHONPATH=aux_re_service python -m aux_re_service.training.db_ingestion \
            --mode execute \
            --dataset-1 "Training Data/Data Set 1/indian_meal_habits_template_5000_users.xlsx" \
            --dataset-2 "Training Data/Data Set 2/populated_indian_meal_habits.xlsx" \
            --training-dir aux_re_service/data/training/v1 \
            --source-row-retention rejected \
            --report "${RUNNER_TEMP}/training-ingestion-report.json" \
            > "${RUNNER_TEMP}/training-ingestion-stdout.json"

      - name: Verify loaded batch and production separation
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT status, synthetic_only, source_row_count, accepted_source_row_count,
                 rejected_source_row_count, normalized_record_count, load_summary
          FROM ml.training_import_batches
          ORDER BY completed_at DESC NULLS LAST
          LIMIT 1;

          SELECT target_table, count(*)
          FROM research.auto_training_records
          WHERE source_dataset_version='foofoo-training-v1'
            AND transformation_version='foofoo-training-db-v1'
          GROUP BY target_table
          ORDER BY target_table;

          DO $$
          BEGIN
            IF (SELECT count(*) FROM research.auto_training_records
                WHERE source_dataset_version='foofoo-training-v1'
                  AND transformation_version='foofoo-training-db-v1') <> 113868 THEN
              RAISE EXCEPTION 'normalized training record count mismatch';
            END IF;
            IF (SELECT count(*) FROM research.training_source_rows
                WHERE batch_id='06a38fd3-ec53-54ab-ab0f-ef04bdf92c44') <> 45 THEN
              RAISE EXCEPTION 'rejected-only source retention count mismatch';
            END IF;
            IF (SELECT count(*) FROM research.training_source_rows
                WHERE batch_id='06a38fd3-ec53-54ab-ab0f-ef04bdf92c44'
                  AND validation_status <> 'rejected') <> 0 THEN
              RAISE EXCEPTION 'accepted raw source payloads were unexpectedly retained';
            END IF;
            IF EXISTS (
              SELECT 1 FROM research.auto_training_records
              WHERE synthetic_only IS NOT TRUE
                AND source_dataset_version='foofoo-training-v1'
            ) THEN
              RAISE EXCEPTION 'training records escaped the synthetic-only invariant';
            END IF;
          END $$;

          SELECT pg_database_size(current_database()) AS database_bytes;
          SELECT schemaname, relname,
                 pg_total_relation_size(format('%I.%I', schemaname, relname)::regclass) AS total_bytes
          FROM pg_stat_user_tables
          WHERE schemaname IN ('ml', 'research')
          ORDER BY total_bytes DESC;
          SQL

      - name: Upload non-sensitive load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-training-ingestion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/training-ingestion-report.json
          if-no-files-found: warn
          retention-days: 30
