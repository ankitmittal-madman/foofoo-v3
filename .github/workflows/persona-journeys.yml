name: persona-journeys

# WP-22 — on-demand synthetic persona UI journeys.
#
# Manually triggered (Actions tab -> "Run workflow"). Drives the REAL onboarding UI (consent ->
# step-1..step-5) through Playwright, one full pass per persona from ops/quality/personas.py (100
# personas: 7 golden + 8 derived + 41 real_persona_derived + 44 adversarial). For accepted
# personas it continues through cold-start calibration, all 21 weekly slots, dated Home meals,
# feedback/lock/refresh events, recipes, add-to-date, search, settings, profile, history and guarded
# data-rights controls. Contract-rejected personas retain their complete negative-path evidence.
# Every rendered stage, API response and user event is recorded in HTML, Excel and the evidence ZIP.
#
# This is NOT part of quality-gate.yml: it needs a live web target, which is
# unavailable/undesirable on every push. It is deliberately a separate, opt-in workflow — same
# honesty rule as the local driver: without a reachable backend it records a truthful
# SKIPPED/FAILED result rather than fabricating evidence, it does not fail the build silently.
#
# The web target is the existing public Vercel production test domain. The workflow deploys the
# checked-out commit there before each run rather than relying on a locally booted Expo server or
# a Vercel preview URL protected by Vercel Authentication.
#
# Auth: no pre-provisioned test account needed — each persona signs up its own fresh random-email
# account via the app's real sign-up flow (see run_persona_journeys.mjs's own header comment).
# This requires the target Supabase project's Auth settings to auto-confirm new signups (no email
# confirmation step); otherwise every persona will fail identically at signup with a "check your
# email to confirm" notice, which the driver reports as the failure reason rather than hanging.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID — used to deploy a fresh preview build of
#                                                       mobile/'s Expo web export for this run
on:
  workflow_dispatch:
    inputs:
      persona_limit:
        description: "Run first N full app journeys (blank = all 100; use 1-5 for a fast smoke pass)"
        required: false
        default: ""

jobs:
  persona-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright driver dependencies
        working-directory: ops/quality/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Excel report dependency
        run: pip install "openpyxl==3.1.5"

      - name: Deploy Expo web build to Vercel
        # The Vercel project already has Root Directory = mobile. Invoke the CLI from repository
        # root so it does not resolve that setting as mobile/mobile.
        working-directory: .
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set — cannot deploy a preview to test against."
            exit 1
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          # Build remotely on Vercel. Local `vercel build` depends on runner shell discovery and
          # currently fails before Expo starts (`spawn sh ENOENT`), while the same source exports
          # successfully through Expo and Vercel's hosted build environment.
          # Preview URLs are intentionally protected by Vercel Authentication. Deploy main to
          # the project's existing public production test domain so Playwright reaches FooFoo,
          # not Vercel's login page.
          vercel deploy --prod --token="$VERCEL_TOKEN"
          url="https://foofoo-v3.vercel.app"
          echo "Deployed production test build: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Waiting for the deployment to become reachable..."
          for i in $(seq 1 30); do
            if curl -sf "$url" > /dev/null; then
              echo "Production test build is up."
              exit 0
            fi
            sleep 5
          done
          echo "Production test build never came up within 2.5 minutes."
          exit 1

      - name: Run the persona UI journey driver
        env:
          GHAR_WEB_URL: ${{ steps.vercel_deploy.outputs.url }}
          GHAR_UI_OUT: "${{ github.workspace }}/ops/quality/reports/persona-journeys"
          GHAR_PERSONAS_LIMIT: ${{ github.event.inputs.persona_limit }}
        run: node ops/quality/ui/run_persona_journeys.mjs

      - name: Render the HTML report
        if: always()
        run: |
          out="${{ github.workspace }}/ops/quality/reports/persona-journeys"
          if [ -d "$out/personas" ]; then
            python3 ops/quality/runner/persona_journey_report.py "$out"
          else
            echo "No per-persona evidence directory — driver was skipped/blocked, nothing to render."
          fi

      - name: Build and validate Excel and ZIP reports
        if: always()
        env:
          GHAR_TEST_ENV: "production-test"
        run: |
          python3 ops/quality/runner/excel_report.py \
            "${{ github.workspace }}/ops/quality/reports/persona-journeys" \
            --kind persona-journey \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload the persona journey report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-journey-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/quality/reports/persona-journeys/test-results.xlsx
            ops/quality/reports/persona-journeys/persona-journey_*.zip
          retention-days: 90
          if-no-files-found: error
