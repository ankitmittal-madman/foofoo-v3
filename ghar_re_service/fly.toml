# Ghar RE v1.0 — Fly.io deployment config (Phase F Tasks 3/5, RE-DOC-10 §13).
#
# NOT YET DEPLOYED. This file is prepared for a human to run `fly deploy` — see
# ghar_re_service/README.md for the exact command sequence. Nothing here has been validated
# against a live Fly.io account; see the README's "what could not be verified" section.
#
# Three constraints from RE-DOC-10 §13 drive everything below:
#   1. minimum-instance floor, NOT scale-to-zero — this sits on the critical path of every
#      recommendation, so a cold start is a user-visible stall (see [http_service] below);
#   2. reachable BY the Edge Function layer — which, per the founder decision recorded below,
#      means public ingress guarded by HMAC, not private-only networking;
#   3. secrets: the shared HMAC key only, never a DB credential (see [env] — it is NOT here).

app = "ghar-re"
primary_region = "bom"   # Mumbai — closest Fly region to the Indian user base this serves.

[build]
  dockerfile = "Dockerfile"

# ---------------------------------------------------------------------------
# Runtime environment. NON-SECRET values only.
# ---------------------------------------------------------------------------
# The shared HMAC secret is deliberately absent: it is set with `fly secrets set` so it lives in
# Fly's encrypted store and is injected at runtime, never committed here. See README §Secrets.
# FOOFOO_ENV=production also arms the fail-closed guard in providers.EnvAuthConfigProvider — with
# it set, the service REFUSES to start if the real secret is missing, rather than silently falling
# back to the dev secret that is published in this repo.
[env]
  FOOFOO_ENV = "production"
  LOG_LEVEL = "info"
  # Per-client request ceiling (providers.EnvRateLimitConfigProvider). Non-secret, and deliberately
  # here rather than baked into the image so it can be retuned with a `fly deploy` alone — no
  # rebuild — when real traffic shows the default is wrong. Raise it if legitimate traffic is being
  # shed (Supabase's egress is NAT'd, so one address carries many users — see ratelimit.py).
  # Set to "0" to disable the limiter entirely.
  GHAR_RE_RATE_LIMIT_PER_MINUTE = "300"
  # Paths are already baked into the image (see Dockerfile ENV); repeated here only where an
  # operator might reasonably want to override without rebuilding. Bundle/contract paths are
  # deliberately NOT repeated — they are image-internal and should not drift from the image.

# ---------------------------------------------------------------------------
# PUBLIC INGRESS — deliberate and founder-confirmed. HMAC is the trust boundary.
# ---------------------------------------------------------------------------
# SETTLED DECISION, NOT A GAP. Supabase Edge Functions run on Supabase's infrastructure, cannot join
# Fly's 6PN private mesh, and cannot present a fixed egress IP range — so neither private-only
# networking nor an IP allowlist is available to us. The service therefore accepts public ingress,
# and the HMAC signature check (auth.py, Phase C.5) is the SOLE trust boundary rather than the
# second of two.
#
# What that boundary actually does: every /v1/recommendations call must carry
# `X-Ghar-Signature: t=<unix>,v1=<hex>`, an HMAC-SHA256 over the raw request bytes keyed on a shared
# secret that exists only in Fly's and Supabase's encrypted secret stores. Unsigned, tampered,
# wrong-secret and replayed (>5 min) requests are rejected 401 BEFORE the body is parsed or the
# engine is touched, with a constant-time comparison. Someone who can reach this port still cannot
# get a recommendation out of it without the secret.
#
# Because that check is now the only thing in the way, it is itself protected: the limiter in
# ratelimit.py runs AHEAD of signature verification, so a flood is shed before any HMAC is computed.
#
# `fly ips list` WILL now show a public IPv4/IPv6. That is expected and correct — not a regression.
#
# NOTE ON THE PREVIOUS REVISION: the comment here used to claim there was "intentionally no
# [http_service] block" while that block was in fact present below. On Fly, [http_service] IS the
# public service declaration, so the private-only intent was never actually achieved by this file.
# Recorded rather than quietly dropped, because anyone who read the old comment was misled about
# what was deployed.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # The catalogue+config bundle is held in memory after startup. 512MB is a starting point for the
  # 39-dish golden sample; re-measure before the real 810-dish catalogue lands (Phase G).

# ---------------------------------------------------------------------------
# Machine floor — RE-DOC-10 §13's "not true scale-to-zero".
# ---------------------------------------------------------------------------
[http_service]
  internal_port = 8080         # matches the Dockerfile's EXPOSE / uvicorn port
  force_https = true           # public now: redirect plain HTTP, so a signed request never crosses
                               # the internet in cleartext. The Edge Function must use https://.
  auto_stop_machines = false   # NEVER stop — a stopped machine means a cold start on a user request
  auto_start_machines = true
  min_machines_running = 1     # the explicit floor RE-DOC-10 §13 requires

  # Concurrency ceiling — a BACKSTOP, not the rate limit. Fly's proxy offers no per-IP rate limiting,
  # which is why the real limiter lives in-process (ratelimit.py). This caps how many requests are
  # in flight at once, which is what keeps a burst from exhausting a 512MB shared-cpu-1x machine.
  # The two are complementary: this bounds concurrency, that bounds rate.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200           # past this, prefer routing to another machine
    hard_limit = 250           # refuse beyond this rather than thrash

  # /readyz gates traffic during a rollout: a new machine is not sent requests until its catalogue
  # and config are fully loaded into memory (RE-DOC-10 §7/§12). Without this, a deploy would send
  # real recommendations to a process still reading its bundle.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

# Liveness: /healthz answers 200 as soon as the process is listening, regardless of load state
# (RE-DOC-10 §12). It is deliberately a DIFFERENT check from /readyz above — using /readyz for
# liveness would make Fly kill a machine that is merely still loading, producing a restart loop
# that never completes startup. Both probe paths are exempt from the rate limiter (main.py), so a
# traffic spike can never cause the platform to declare a healthy machine dead.
[checks]
  [checks.liveness]
    type = "http"
    port = 8080
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

# ---------------------------------------------------------------------------
# Deploy strategy — rollback-able independently of the Edge Function (RE-DOC-10 §13).
# ---------------------------------------------------------------------------
[deploy]
  # Rolling: bring up a new machine, wait for its /readyz, then retire the old one — so there is
  # never a window with zero ready machines serving the recommendation path.
  strategy = "rolling"
