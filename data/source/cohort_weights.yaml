config_version: 1.0
generated_from: Core Spine FROZEN master formula (w_cohort . S_cohort term) + WP-15 Class-Enriched RE + WP-16 Cohort Intelligence
# w_cohort . S_cohort is the master-formula cohort term. WP-16 makes S_cohort a GRADED [0,1]
# class-affinity (ghar_re_core.cohort_intel.class_affinity, learned from the persona DB's weekly
# plan and migration-blended), replacing WP-15's binary 0/1 membership check.
#
# The weight is now COLD-START STRONG and DECAYS with real interaction volume (Founder directive
# 2026-08-02): a brand-new household's slate should feel like the persona-DB plan; as genuine
# accept/reject feedback accumulates the cohort prior should yield to learned personal signal.
#   w_eff(n) = floor + (coldstart - floor) * 2^(-n / halflife)      n = ctx.interaction_count
# NOTE: feedback_events currently has 0 production rows, so n=0 for every live household today and
# w_eff = coldstart for everyone until real signals accrue — the decay mechanism exists, the data
# to move along it does not yet (same honest constraint WP-14/WP-15 flagged).
# COMPOSITIONAL vs LEARNED blend (WP-17). class_affinity fuses the compositional persona/state/
# migration plan (ghar_re_core.cohort_plan.class_plan — the persona-specific, regionally-grounded
# structure) with the WP-16 learned frequency model (smoothing/generalization). Compositional
# dominant: it is what makes a slate feel like the persona-DB plan for THIS household rather than the
# cross-cohort average the frequency model plateaus at.
class_plan:
  compositional_weight: 0.70
  learned_weight: 0.30

cohort:
  w_cohort: 0.15              # legacy WP-15 base weight (retained; = the decay floor below)
  w_cohort_coldstart: 0.60    # strong at n=0 so cold-start feels like the persona-DB plan
  w_cohort_floor: 0.15        # asymptotic weight once the household is well-learned
  coldstart_halflife: 25      # interactions at which the extra cold-start lift has halved

# FOREIGN-CUISINE COLD-START DEMOTE (WP-16.1). The persona-DB science is entirely REGIONAL INDIAN —
# no cohort's class plan ever contains a foreign (zone=Global: Chinese/continental/etc.) dish, so at
# cold-start a foreign dish has no cohort/palette anchor and can only rank on stray BASE terms
# (e.g. an inflated sig_score — Veg Burger is mis-tagged sig=0.75). That let 23% of the catalogue
# surface incoherently for regional households (test_13 Gujarat: "Veg Burger + Corn Chowder"). This
# subtracts a demote from any zone=Global dish, COLD-START STRONG and decaying with interaction
# volume on the SAME curve as w_cohort — so foreign food is pushed down for a brand-new regional
# household but resurfaces naturally once someone actually accepts it. Set demote_coldstart: 0.0 to
# disable entirely. This is a tunable product judgement (foreign food is legitimately popular in
# urban India) — deliberately soft (a demote, never a hard filter), and it decays to a small floor.
foreign_demote:
  demote_coldstart: 0.80      # subtracted per zone=Global dish at n=0
  demote_floor: 0.10          # asymptotic demote once the household is well-learned
  halflife: 25                # same decay cadence as the cohort weight
