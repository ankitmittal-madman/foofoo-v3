primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  AUX_REC_ENABLED = "true"
  AUX_REC_MODE = "shadow"
  AUX_REC_ALLOW_OVERRIDE = "false"
  AUX_REC_REQUIRE_CONSTRAINT_PASS = "true"
  AUX_REC_USE_LOCAL_RERANKER = "true"
  AUX_REC_LOG_ALL = "true"
  AUX_REC_MODEL_QDRANT_ENABLED = "true"
  AUX_REC_MODEL_LIGHTFM_ENABLED = "false"
  AUX_REC_MODEL_LIGHTFM_ALLOW_SYNTHETIC = "false"
  AUX_REC_MODEL_LIGHTFM_ALLOW_UNPROMOTED = "false"
  AUX_REC_FEEDBACK_ENABLED = "false"
  AUX_REC_EXPERIMENT_ENABLED = "false"
  AUX_REC_EXPERIMENT_PERCENT = "0.0"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

[checks]
  [checks.liveness]
    type = "http"
    port = 8081
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[deploy]
  strategy = "rolling"
