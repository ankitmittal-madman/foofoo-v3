name: Aux RE rollout evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Same-repository successful run containing aux-rollout-inputs
        required: true
        type: string
      since:
        description: Inclusive ISO-8601 start of the live evidence window
        required: true
        type: string
      until:
        description: Exclusive ISO-8601 end of the live evidence window (maximum 31 days)
        required: true
        type: string
      publication_version:
        description: Full sha256 recommendation catalogue publication
        required: true
        type: string
      confirm:
        description: Type compose-aux-rollout-evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-aux-re-rollout-evidence
  cancel-in-progress: false

jobs:
  compose:
    if: inputs.confirm == 'compose-aux-rollout-evidence'
    environment: production
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FOOFOO_SUPABASE_URI: ${{ secrets.FOOFOO_SUPABASE_URI }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate governed source run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "$SOURCE_RUN_ID" in
            *[!0-9]*|'') echo "source_run_id must be numeric" >&2; exit 1 ;;
          esac
          conclusion="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion --jq '.conclusion')"
          workflow_name="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName --jq '.workflowName')"
          test "$conclusion" = "success"
          test "$workflow_name" = "Aux RE governed rollout inputs"

      - name: Download independently approved source reports
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/aux-rollout-inputs"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name aux-rollout-inputs --dir "$RUNNER_TEMP/aux-rollout-inputs"
          test -f "$RUNNER_TEMP/aux-rollout-inputs/offline.json"
          test -f "$RUNNER_TEMP/aux-rollout-inputs/load.json"
          test -f "$RUNNER_TEMP/aux-rollout-inputs/targets.json"
          test "$(find "$RUNNER_TEMP/aux-rollout-inputs" -type f | wc -l)" -eq 3

      - name: Install aggregate database client
        run: python -m pip install "psycopg2-binary>=2.9,<3"

      - name: Export service-only live aggregates
        env:
          EVIDENCE_SINCE: ${{ inputs.since }}
          EVIDENCE_UNTIL: ${{ inputs.until }}
          PUBLICATION_VERSION: ${{ inputs.publication_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/aux-rollout-live"
          python -m ops.recommendation.live_rollout_evidence \
            --since "$EVIDENCE_SINCE" --until "$EVIDENCE_UNTIL" \
            --publication-version "$PUBLICATION_VERSION" \
            --health-output "$RUNNER_TEMP/aux-rollout-live/health.json" \
            --guardrail-output "$RUNNER_TEMP/aux-rollout-live/guardrails.json"

      - name: Compose one immutable rollout evidence file
        run: |
          mkdir -p "$RUNNER_TEMP/aux-rollout-evidence"
          python -m ops.recommendation.rollout_evidence \
            --current-mode auto \
            --offline "$RUNNER_TEMP/aux-rollout-inputs/offline.json" \
            --load "$RUNNER_TEMP/aux-rollout-inputs/load.json" \
            --targets "$RUNNER_TEMP/aux-rollout-inputs/targets.json" \
            --health "$RUNNER_TEMP/aux-rollout-live/health.json" \
            --guardrails "$RUNNER_TEMP/aux-rollout-live/guardrails.json" \
            --output "$RUNNER_TEMP/aux-rollout-evidence/rollout-evidence.json"

      - uses: actions/upload-artifact@v4
        with:
          name: aux-rollout-evidence
          path: ${{ runner.temp }}/aux-rollout-evidence/rollout-evidence.json
          retention-days: 30
          if-no-files-found: error
