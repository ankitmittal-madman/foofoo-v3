name: Deploy recommendation Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-recommendation-edge to deploy plan and recommendations
        required: true
        type: string

concurrency:
  group: production-recommendation-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy-recommendation-edge'
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require governed production target
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Configure SUPABASE_ACCESS_TOKEN in the production environment." >&2
            exit 1
          fi
          if [ -z "$PRODUCTION_PROJECT_REF" ]; then
            echo "Configure PRODUCTION_PROJECT_REF in the production environment." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Edge sources before deployment
        working-directory: supabase
        run: |
          deno fmt --check
          deno lint
          deno check functions/_shared/mod.ts
          deno test --allow-env functions/_tests/

      - name: Deploy recommendation serving functions
        run: |
          supabase functions deploy plan --project-ref "$PRODUCTION_PROJECT_REF"
          supabase functions deploy recommendations --project-ref "$PRODUCTION_PROJECT_REF"
